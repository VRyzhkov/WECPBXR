name: Publish Windows Release

on:
  push:
    tags:
      - 'v*' # Запуск сборки при создании тегов вроде v1.0.0-beta

jobs:
  build:
    # Для сборки WPF/Windows-приложений нужна Windows-машина
    runs-on: windows-latest 
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 1. Публикация графической версии (UI)
    - name: Publish UI Application
      run: |
        dotnet publish WECPBXR.UI/WECPBXR.UI.csproj -c Release -r win-x64 --self-contained false -o ./publish/WECPBXR_UI

    # 2. Публикация консольной версии (Console)
    - name: Publish Console Application
      run: |
        dotnet publish WECPBXR.Console/WECPBXR.Console.csproj -c Release -r win-x64 --self-contained false -o ./publish/WECPBXR_Console

    # 3. Упаковка в ZIP-архивы с помощью встроенного в Windows PowerShell командлета
    - name: Zip Artifacts
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/WECPBXR_UI/* -DestinationPath ./WECPBXR-UI-win-x64.zip
        Compress-Archive -Path ./publish/WECPBXR_Console/* -DestinationPath ./WECPBXR-Console-win-x64.zip

    # 4. Создание релиза на GitHub
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          WECPBXR-UI-win-x64.zip
          WECPBXR-Console-win-x64.zip
        generate_release_notes: true
        prerelease: true # Автоматически ставит отметку Pre-release (Бета)