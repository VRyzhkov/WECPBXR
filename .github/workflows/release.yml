name: Publish Release

on:
  push:
    tags:
      - 'v*' # Запуск сборки при создании тегов вроде v1.0.0-beta

jobs:
  build:
    runs-on: windows-latest 
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Velopack CLI
      shell: pwsh
      run: |
        dotnet tool install --global vpk --version 1.2.0

    - name: Read version from tag
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        if ($version.StartsWith("v")) {
          $version = $version.Substring(1)
        }
        "WECPBXR_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        "WECPBXR_INFORMATIONAL_VERSION=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append

    # 1. Публикация графической версии (UI) под Windows
    - name: Publish UI Windows
      shell: pwsh
      run: |
        dotnet publish WECPBXR.UI/WECPBXR.UI.csproj -c Release -r win-x64 --self-contained true -o ./publish/WECPBXR_UI_win-x64 -p:Version=$env:WECPBXR_VERSION -p:InformationalVersion=$env:WECPBXR_INFORMATIONAL_VERSION

    # 2. Публикация графической версии (UI) под Linux
    - name: Publish UI Linux
      shell: pwsh
      run: |
        dotnet publish WECPBXR.UI/WECPBXR.UI.csproj -c Release -r linux-x64 --self-contained true -o ./publish/WECPBXR_UI_linux-x64 -p:Version=$env:WECPBXR_VERSION -p:InformationalVersion=$env:WECPBXR_INFORMATIONAL_VERSION

    # 3. Публикация консольной версии (Console)
    - name: Publish Console Application
      shell: pwsh
      run: |
        dotnet publish WECPBXR.Console/WECPBXR.Console.csproj -c Release -r win-x64 --self-contained true -o ./publish/WECPBXR_Console_win-x64 -p:Version=$env:WECPBXR_VERSION -p:InformationalVersion=$env:WECPBXR_INFORMATIONAL_VERSION

    # 4. Упаковка артефактов
    - name: Package UI with Velopack
      shell: pwsh
      run: |
        vpk pack --packId VRyzhkov.WECPBXR.UI --packTitle WECPBXR --packAuthors VRyzhkov --packVersion $env:WECPBXR_VERSION --packDir ./publish/WECPBXR_UI_win-x64 --mainExe WECPBXR.UI.exe --channel win --runtime win-x64 --outputDir ./velopack/win --icon ./WECPBXR.UI/Assets/midi-connector.ico
        vpk pack --packId VRyzhkov.WECPBXR.UI --packTitle WECPBXR --packAuthors VRyzhkov --packVersion $env:WECPBXR_VERSION --packDir ./publish/WECPBXR_UI_linux-x64 --mainExe WECPBXR.UI --channel linux --runtime linux-x64 --outputDir ./velopack/linux --icon ./WECPBXR.UI/Assets/midi-connector.png

    - name: Zip Console Artifact
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/WECPBXR_Console_win-x64/* -DestinationPath ./WECPBXR-Console-win-x64.zip

    # 5. Создание релиза на GitHub
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          velopack/win/*
          velopack/linux/*
          WECPBXR-Console-win-x64.zip
        generate_release_notes: true
        prerelease: true # Автоматически ставит отметку Pre-release (Бета)
